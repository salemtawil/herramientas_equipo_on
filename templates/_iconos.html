{# Iconos SVG en línea (sin librerías). Siempre decorativos: aria-hidden. #}
{% macro icono(nombre, clase="icon") -%}
<svg class="{{ clase }}" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false">
  {%- if nombre == "inicio" -%}
    <rect x="3.5" y="3.5" width="7" height="7" rx="1.5"/><rect x="13.5" y="3.5" width="7" height="4.5" rx="1.5"/><rect x="13.5" y="11" width="7" height="9.5" rx="1.5"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.5"/>
  {%- elif nombre == "actividad" -%}
    <path d="M3 12h4l2.5-6 5 12L17 12h4"/>
  {%- elif nombre == "reporte" -%}
    <path d="M4 20V10M10 20V4M16 20v-7M21 20H3"/>
  {%- elif nombre == "documento" -%}
    <path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5M9 13h6M9 17h4"/>
  {%- elif nombre == "calidad" -%}
    <path d="M20 12a8 8 0 1 1-3.3-6.5"/><path d="m9 11.5 2.5 2.5L20 5.5"/>
  {%- elif nombre == "llamada" -%}
    <path d="M5 4h3l2 5-2.5 1.5a11 11 0 0 0 6 6L15 14l5 2v3a2 2 0 0 1-2 2A16 16 0 0 1 3 6a2 2 0 0 1 2-2z"/><path d="M15 3h6v6M21 3l-6 6"/>
  {%- elif nombre == "comparar" -%}
    <path d="M8 3v18M16 3v18"/><path d="m4 8 4-4 4 4M12 16l4 4 4-4"/>
  {%- elif nombre == "tabla" -%}
    <rect x="3.5" y="4.5" width="17" height="15" rx="2"/><path d="M3.5 9.5h17M3.5 14.5h17M9.5 9.5v10"/>
  {%- elif nombre == "equipo" -%}
    <circle cx="9" cy="8" r="3.2"/><path d="M3.5 19a5.5 5.5 0 0 1 11 0"/><circle cx="17" cy="9.5" r="2.4"/><path d="M15.5 19a4.5 4.5 0 0 1 5-4.4"/>
  {%- elif nombre == "reloj" -%}
    <circle cx="12" cy="13" r="7.5"/><path d="M12 9.5V13l2.5 2M9.5 2.5h5"/>
  {%- elif nombre == "flecha" -%}
    <path d="M5 12h14M13 6l6 6-6 6"/>
  {%- elif nombre == "tema" -%}
    <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"/>
  {%- elif nombre == "volver" -%}
    <path d="M19 12H5M11 6l-6 6 6 6"/>
  {%- elif nombre == "alerta" -%}
    <path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.5v.01"/>
  {%- elif nombre == "abierto" -%}
    <circle cx="12" cy="12" r="8.5"/><path d="M8 12h8"/>
  {%- endif -%}
</svg>
{%- endmacro %}
